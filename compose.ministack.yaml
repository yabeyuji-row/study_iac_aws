services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    environment:
      GATEWAY_PORT: "4566"
      LOG_LEVEL: "INFO"
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
      RDS_PERSIST: "1"
      DOCKER_NETWORK: "${MINISTACK_DOCKER_NETWORK:-study_aws_default}"
    volumes:
      - ministack_state:/tmp/ministack-state
      - ministack_s3:/tmp/ministack-data/s3
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ministack_state:
  ministack_s3:
